name: Machine checks
# Checks every machine in this repository against the Open-XY SDK it targets:
# its records and sources, a browser preview of each synth, its own host tests,
# and a firmware compile with the pinned Blackfin tools. No stock files or device.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  # The Open-XY SDK this repository is checked against. Use the SDK release
  # that matches "sdk" in each machine.json.
  OPEN_XY_REPOSITORY: etcetc000/open-xy
  # Until the SDK change that moves these machines here merges, check against its branch.
  OPEN_XY_REF: machines/core-repo
jobs:
  machines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: machines
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.OPEN_XY_REPOSITORY }}
          ref: ${{ env.OPEN_XY_REF }}
          path: open-xy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preview and host test tools
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld
          python -m pip install numpy==2.3.5
      - name: Machine checks
        shell: bash
        run: |
          # A machine at the repository root, or one in each machines/<id>/.
          args=()
          for record in machines/machine.json machines/machines/*/machine.json; do
            [ -f "$record" ] && args+=(--machine "$(dirname "$record")")
          done
          python open-xy/sdk.py test "${args[@]}" --cxx clang++ --host-cxx g++
  firmware:
    # The pinned Blackfin tools run on Windows x86_64 and macOS arm64.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: machines
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.OPEN_XY_REPOSITORY }}
          ref: ${{ env.OPEN_XY_REF }}
          path: open-xy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned Blackfin tools
        run: python open-xy/sdk.py toolchain fetch
      - name: Firmware compile with every machine here
        shell: bash
        run: |
          args=()
          for record in machines/machine.json machines/machines/*/machine.json; do
            [ -f "$record" ] && args+=(--machine "$(dirname "$record")")
          done
          python open-xy/sdk.py compile "${args[@]}" --out "$RUNNER_TEMP/module"
